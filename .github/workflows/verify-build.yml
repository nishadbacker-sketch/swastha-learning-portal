name: Verify Next.js Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate encrypted backup script and fail-closed preflight (no database access)
        run: |
          set -euo pipefail
          bash -n scripts/backup-database.sh
          if env -i PATH="$PATH" bash scripts/backup-database.sh > /tmp/swastha-backup-preflight.out 2>&1; then
            echo "::error::Backup script unexpectedly ran without required credentials"
            exit 1
          fi
          grep -q "Required GitHub Actions secret" /tmp/swastha-backup-preflight.out
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start built portal (smoke test only)
        run: |
          npm run start -- -p 3100 > /tmp/swastha-smoke.log 2>&1 &
          echo $! > /tmp/swastha-smoke.pid
          for i in $(seq 1 40); do
            if curl --silent --output /dev/null http://127.0.0.1:3100/login; then exit 0; fi
            sleep 1
          done
          cat /tmp/swastha-smoke.log
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Run non-destructive smoke tests
        run: node --test tests/phase1-smoke.test.mjs
        env:
          SWASTHA_SMOKE_BASE_URL: http://127.0.0.1:3100
      - name: Run parent portal source-regression checks (no user data writes)
        run: node --test tests/parent-portal-regression.test.mjs
      - name: Verify assessment workflow source guards (no user data writes)
        run: node --test tests/assessment-workflow-regression.test.mjs
      - name: Verify email authentication and recovery UI safeguards
        run: node --test tests/email-auth-regression.test.mjs
      - name: Check appointment staff notification safety (no emails sent)
        run: node --test tests/appointment-email-regression.test.mjs
      - name: Check planned in-portal assessment and activity notification history
        run: node --test tests/portal-notification-history.test.mjs
      - name: Verify staff top-bar popup mirrors parent notification controls
        run: node --test tests/staff-notification-popup.test.mjs
      - name: Verify appointment follow-up alert guards (read-only)
        run: node --test tests/appointment-followup-alerts.test.mjs
      - name: Verify Phase 5 Owner-identity authorization and audit controls
        run: node --test tests/phase5-security-hardening.test.mjs
      - name: Require production anonymous security test configuration
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Production anonymous database security tests cannot run: configure NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as GitHub Actions secrets."
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Verify Supabase anonymous access (read-only)
        run: node --test tests/phase1-database-security.test.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Verify IDP student progress overview uses assigned approved records
        run: node --test tests/student-progress-overview.test.mjs
      - name: Verify Phase 6 read-only student progress report access guards
        run: node --test tests/phase6-student-progress-report.test.mjs
      - name: Verify Phase 6 staging IDP parity and history source guards
        run: node --test tests/phase6-staging-parity-guards.test.mjs
      - name: Verify Phase 7 sessions and approved Parent summary access controls
        run: node --test tests/phase7-clinic-sessions.test.mjs
      - name: Verify Phase 7 Clinic Admin approved IDP read-only permissions
        run: node --test tests/phase7-clinic-admin-idp-visibility.test.mjs
      - name: Verify Phase 8 clinic conflict detection and operations access controls
        run: node --test tests/phase8-clinic-operations.test.mjs
      - name: Verify numbered holistic radar skills and unscored competencies
        run: node --test tests/holistic-radar-skill-markers.test.mjs
      - name: Verify unified main-website-style footer layout and Parent preservation
        run: node --test tests/main-site-footer-layout.test.mjs
      - name: Verify unified student workspace and staff action security (read-only)
        run: node --test tests/staff-workspace-integrity.test.mjs
      - name: Verify one Staff Workspace without duplicated role dashboard navigation
        run: node --test tests/staff-workspace-no-duplicates.test.mjs
      - name: Verify common staff workspace, permissions and synchronized charts
        run: node --test tests/unified-staff-workspace.test.mjs
      - name: Verify common fixes across all staff roles
        run: node --test tests/all-staff-regression-coverage.test.mjs
      - name: Verify one teacher analytics student selector
        run: node --test tests/teacher-analytics-single-student-selector.test.mjs
      - name: Verify role-based learning diagrams, reviewed results and empty-state privacy
        run: node --test tests/role-based-learning-insights-charts.test.mjs
      - name: Verify secured issued-course certificates, PDF and QR route
        run: node --test tests/course-completion-certificates.test.mjs
      - name: Verify review-gated assessment certificates, Director title and QR privacy
        run: node --test tests/assessment-completion-certificates.test.mjs
      - name: Verify Parent self-service reviewed assessment certificate downloads and RLS
        run: node --test tests/parent-reviewed-assessment-certificate-download.test.mjs
      - name: Verify staging parent and teacher isolation (read-only, opt-in)
        if: ${{ vars.SWASTHA_RUN_STAGING_AUTH_TESTS == 'true' }}
        run: node --test tests/staging-authenticated-readonly.test.mjs
        env:
          SWASTHA_STAGING_SUPABASE_URL: ${{ secrets.SWASTHA_STAGING_SUPABASE_URL }}
          SWASTHA_STAGING_SUPABASE_ANON_KEY: ${{ secrets.SWASTHA_STAGING_SUPABASE_ANON_KEY }}
          SWASTHA_STAGING_PARENT_A_EMAIL: ${{ secrets.SWASTHA_STAGING_PARENT_A_EMAIL }}
          SWASTHA_STAGING_PARENT_A_PASSWORD: ${{ secrets.SWASTHA_STAGING_PARENT_A_PASSWORD }}
          SWASTHA_STAGING_PARENT_B_EMAIL: ${{ secrets.SWASTHA_STAGING_PARENT_B_EMAIL }}
          SWASTHA_STAGING_PARENT_B_PASSWORD: ${{ secrets.SWASTHA_STAGING_PARENT_B_PASSWORD }}
          SWASTHA_STAGING_TEACHER_EMAIL: ${{ secrets.SWASTHA_STAGING_TEACHER_EMAIL }}
          SWASTHA_STAGING_TEACHER_PASSWORD: ${{ secrets.SWASTHA_STAGING_TEACHER_PASSWORD }}
      - name: Verify Phase 5 staging Admin and Clinic Admin role protections (opt-in, read-only)
        if: ${{ vars.SWASTHA_RUN_PHASE5_ROLE_TESTS == 'true' }}
        run: node --test tests/staging-phase5-role-positive.test.mjs
        env:
          SWASTHA_STAGING_SUPABASE_URL: ${{ secrets.SWASTHA_STAGING_SUPABASE_URL }}
          SWASTHA_STAGING_SUPABASE_ANON_KEY: ${{ secrets.SWASTHA_STAGING_SUPABASE_ANON_KEY }}
          SWASTHA_STAGING_OWNER_USER_ID: ${{ secrets.SWASTHA_STAGING_OWNER_USER_ID }}
          SWASTHA_STAGING_PARENT_A_EMAIL: ${{ secrets.SWASTHA_STAGING_PARENT_A_EMAIL }}
          SWASTHA_STAGING_PARENT_A_PASSWORD: ${{ secrets.SWASTHA_STAGING_PARENT_A_PASSWORD }}
          SWASTHA_STAGING_TEACHER_EMAIL: ${{ secrets.SWASTHA_STAGING_TEACHER_EMAIL }}
          SWASTHA_STAGING_TEACHER_PASSWORD: ${{ secrets.SWASTHA_STAGING_TEACHER_PASSWORD }}
          SWASTHA_STAGING_ADMIN_EMAIL: ${{ secrets.SWASTHA_STAGING_ADMIN_EMAIL }}
          SWASTHA_STAGING_ADMIN_PASSWORD: ${{ secrets.SWASTHA_STAGING_ADMIN_PASSWORD }}
          SWASTHA_STAGING_CLINIC_ADMIN_EMAIL: ${{ secrets.SWASTHA_STAGING_CLINIC_ADMIN_EMAIL }}
          SWASTHA_STAGING_CLINIC_ADMIN_PASSWORD: ${{ secrets.SWASTHA_STAGING_CLINIC_ADMIN_PASSWORD }}
      - name: Show logs on failure
        if: failure()
        run: cat /tmp/swastha-smoke.log 2>/dev/null || true
