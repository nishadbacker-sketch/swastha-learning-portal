name: Verify Next.js Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start built portal (smoke test only)
        run: |
          npm run start -- -p 3100 > /tmp/swastha-smoke.log 2>&1 &
          echo $! > /tmp/swastha-smoke.pid
          for i in $(seq 1 40); do
            if curl --silent --output /dev/null http://127.0.0.1:3100/login; then exit 0; fi
            sleep 1
          done
          cat /tmp/swastha-smoke.log
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Run non-destructive smoke tests
        run: node --test tests/phase1-smoke.test.mjs
        env:
          SWASTHA_SMOKE_BASE_URL: http://127.0.0.1:3100
      - name: Show logs on failure
        if: failure()
        run: cat /tmp/swastha-smoke.log 2>/dev/null || true
