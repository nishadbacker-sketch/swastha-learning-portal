name: Daily Encrypted Supabase Backup

on:
  schedule:
    # 02:30 UTC = 08:00 Asia/Kolkata (GitHub may delay scheduled jobs)
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swastha-daily-production-backup
  cancel-in-progress: false

jobs:
  encrypted-offsite-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout backup script
        uses: actions/checkout@v4
      - name: Install age encryption CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Check backup encryption and storage prerequisites
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in SUPABASE_BACKUP_DB_URL BACKUP_AGE_RECIPIENT BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Backup NOT configured: required secret ${name} is missing. This workflow will not produce a backup."
              exit 1
            fi
          done
          command -v age && command -v aws && command -v docker
      - name: Export, encrypt, upload and verify production database
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: bash scripts/backup-database.sh
